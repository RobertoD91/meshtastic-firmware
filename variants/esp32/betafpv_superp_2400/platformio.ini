[env:betafpv_superp_2400]
custom_meshtastic_hw_model = 136
custom_meshtastic_hw_model_slug = BETAFPV_SUPERP_2400_RX
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = BetaFPV SuperP 2.4GHz RX
custom_meshtastic_tags = BetaFPV

extends = esp32_base
board = esp32doit-devkit-v1
board_level = extra
build_flags =
  ${esp32_base.build_flags}
  -DBETAFPV_SUPERP_2400_RX
  -DVTABLES_IN_FLASH=1
  -DCONFIG_DISABLE_HAL_LOCKS=1
  -O2
  -I variants/esp32/betafpv_superp_2400
board_build.f_cpu = 240000000L
upload_protocol = esptool
upload_speed = 460800
