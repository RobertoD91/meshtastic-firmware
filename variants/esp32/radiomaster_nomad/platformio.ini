[env:radiomaster_nomad]
custom_meshtastic_hw_model = 135
custom_meshtastic_hw_model_slug = RADIOMASTER_NOMAD
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Radiomaster Nomad

extends = esp32_base
board = esp32doit-devkit-v1
board_level = extra
build_flags =
  ${esp32_base.build_flags}
  -DRADIOMASTER_NOMAD
  -DVTABLES_IN_FLASH=1
  -DCONFIG_DISABLE_HAL_LOCKS=1
  -DMESHTASTIC_EXCLUDE_I2C=1
  -DRADIOLIB_DEBUG_BASIC=1
  -DRADIOLIB_DEBUG_PROTOCOL=1
  -DRADIOLIB_DEBUG_SPI=1
  -DHAS_TELEMETRY=0
  -O2
  -I variants/esp32/radiomaster_nomad
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/esp32/radiomaster_nomad>
board_build.f_cpu = 240000000L
upload_protocol = esptool
