[env:radiomaster_nomad]
extends = esp32_base
board = esp32doit-devkit-v1
board_level = extra
build_flags =
  ${esp32_base.build_flags}
  -DRADIOMASTER_NOMAD
  -DPRIVATE_HW
  -DVTABLES_IN_FLASH=1
  -DCONFIG_DISABLE_HAL_LOCKS=1
  -DMESHTASTIC_EXCLUDE_I2C=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DRADIOLIB_DEBUG_BASIC=0
  -DRADIOLIB_DEBUG_PROTOCOL=0
  -DRADIOLIB_DEBUG_SPI=0
  -O2
  -I variants/esp32/radiomaster_nomad
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/esp32/radiomaster_nomad>
board_build.f_cpu = 240000000L
upload_protocol = esptool
